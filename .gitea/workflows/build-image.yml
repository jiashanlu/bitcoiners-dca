name: Build & ship bitcoiners-dca image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

# Builds bitcoiners-dca:latest on dockers-LXC and runs the test gate
# against the exact image. Then, by ref:
#
#   main / v* tags → ship the image to 192.168.4.213 (CT113 dca-bot on
#                    proxmox2, Ben's self-hosted bot, HA to proxmox1)
#   dev            → build + test only, nothing is shipped
#
# Hosted DCA (Hetzner tenants + provisioner) was retired 2026-10-07, so
# there is no provisioner image and no host-side git checkout any more.
#
# The running bot is never restarted by CI. After an image lands,
# recreate it explicitly on CT113:
#   cd /opt/bitcoiners-dca/tenants/benbois-ae0e0001 && docker compose up -d --force-recreate
#
# Bug history: #143 — the deploy key is materialized from the
# DEPLOY_SSH_KEY secret on each run (ephemeral act_runner containers have
# no key on disk).

jobs:
  build-and-ship:
    runs-on: dockers-lxc
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI in job container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends docker.io openssh-client >/dev/null
          docker --version

      - name: Build bitcoiners-dca:latest
        run: |
          docker build -t bitcoiners-dca:latest -t bitcoiners-dca:git-${GITEA_SHA:0:7} .

      - name: Test gate — pytest against the built image
        # A throwaway build stage layers the tests onto the EXACT image
        # being shipped and runs the suite during the build. A -v mount
        # would not work because the job container talks to the HOST docker
        # daemon, so host-side volume paths don't match the job workspace
        # (the #154 runner quirk).
        run: |
          docker build -t bitcoiners-dca:testgate -f - . <<'EOF'
          FROM bitcoiners-dca:latest
          COPY tests /work/tests
          WORKDIR /work
          RUN pip install -q pytest pytest-asyncio && python -m pytest tests -q
          EOF
          docker rmi bitcoiners-dca:testgate >/dev/null 2>&1 || true

      - name: Ship image to CT113 (main / tags only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_HOST: 192.168.4.213
        run: |
          mkdir -p /root/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > /root/.ssh/deploy_key
          chmod 600 /root/.ssh/deploy_key
          # PINNED host key (audit 2026-06-10 P3: never trust-on-first-use).
          # CT113 created 2026-10-07; rotate here if it is ever reinstalled.
          echo '192.168.4.213 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOUr8GRYf0NMTVBWxUN2nUycuHE3eFXNVah8wtDLedEK' \
            >> /root/.ssh/known_hosts
          # DEPLOY_SSH_KEY = infra/ci_dca_deploy_ed25519. On CT113 that key is
          # pinned to command="/usr/bin/docker load",restrict, so it can only
          # load an image (docker load reads the gzip stream directly).
          docker save bitcoiners-dca:latest | gzip -1 | ssh -i /root/.ssh/deploy_key \
            root@${TARGET_HOST}
          shred -u /root/.ssh/deploy_key 2>/dev/null || rm -f /root/.ssh/deploy_key
